const watched=new Set(),wanted=new Set();
const workId=m=>JSON.stringify([m.title,m.year]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=m=>encodeURIComponent(workId(m));
const detailHref=m=>'#work='+key(m);
const pic=m=>ASSETS[m.title]||'';
const current=()=>DATA.recent.slice(0,6);
function controls(m){const id=workId(m);return `<button class="secondary" data-wanted="${key(m)}" aria-pressed="${wanted.has(id)}">${wanted.has(id)?'✓ 보고 싶은 것':'＋ 보고 싶은 것'}</button><button class="secondary" data-watched="${key(m)}" aria-pressed="${watched.has(id)}">${watched.has(id)?'✓ 본 것':'본 것으로 표시'}</button>`;}
function card(m){const critic=DATA.sources?.[workId(m)]?.critics?.[0];return `<article class="recommendation"><a class="poster-link" href="${detailHref(m)}"><img src="${pic(m)}" alt="${esc(m.title)} 포스터"></a><div class="caption"><span class="who">${esc(m.who)} 추천</span><h2><a href="${detailHref(m)}">${esc(m.title)}</a></h2><div class="rec-meta"><span>${esc(m.year)}</span><a href="${detailHref(m)}">추천 근거·평론 확인 ↗</a></div>${critic?`<div class="card-critics"><span>${esc(critic.publisher)} · 외부 평론</span><strong>${esc(critic.score)}</strong><p>${esc(critic.summary)}</p><small>${esc(critic.scoreLabel)}</small><br><a href="${esc(critic.url)}" target="_blank" rel="noopener">평론 출처 ↗</a></div>`:''}<div class="rec-actions">${controls(m)}</div></div></article>`;}
function home(){const movies=current();return `<section><div class="home-head"><h1>이번 방송 추천작</h1><time datetime="${DATA.latest}">${DATA.latest} 방송</time></div><div class="recommendations" data-count="${movies.length}">${movies.map(card).join('')}</div></section>`;}
function sourcePanels(m){const refs=DATA.sources?.[workId(m)]||{};return `<section class="source-panel"><span class="kind">ON THE SHOW</span><h2>방송에서 어떻게 언급했나요?</h2><p>${esc(m.who)} · ${esc(m.date)} 추천 기록</p>${refs.broadcastQuote?`<blockquote>${esc(refs.broadcastQuote)}</blockquote>`:'<p class="muted">추천 사실은 기록되어 있지만, 정확한 발언·추천 이유는 아직 확인하지 못했습니다.</p>'}${refs.broadcastUrl?`<a class="fine" href="${esc(refs.broadcastUrl)}" target="_blank" rel="noopener">${esc(refs.broadcastLabel||'방송 원문 참고')} ↗</a>`:''}<p class="fine">추천 사실과 직접 인용을 구분합니다. 아래 외부 평론은 방송 출연자의 평가가 아닙니다.</p></section><section class="source-panel"><span class="kind">EXTERNAL CRITICS</span><h2>외부 평론</h2>${refs.critics?.length?refs.critics.map(r=>`<div class="fact"><h3>${esc(r.publisher)}${r.author?' · '+esc(r.author):''}</h3>${r.score?`<div class="critic-score">${esc(r.score)}</div>`:''}<p>${esc(r.summary)}</p><a class="fine" href="${esc(r.url)}" target="_blank" rel="noopener">평론 원문 ↗</a><p class="fine">${esc(r.scoreLabel||'평론 요약')} · 출처 확인 ${esc(r.checkedAt)}</p></div>`).join(''):'<p class="muted">검증된 평론가 평가를 아직 확보하지 못했습니다. 관객 평점이나 줄거리로 대신하지 않습니다.</p>'}</section>`;}
function detail(id){const m=DATA.recent.find(m=>workId(m)===id);if(!m)return '<section class="empty">이 시안에 없는 작품입니다. <a href="#home">홈으로</a></section>';const history=DATA.histories?.[id]||[m];return `<p><a class="fine" href="#home">← 추천작으로</a></p><section class="detail"><img src="${pic(m)}" alt="${esc(m.title)} 포스터"><div class="info"><div class="intro"><span class="eyebrow">RECOMMENDED FILM</span><h1>${esc(m.title)}</h1><p class="muted">${esc(m.year)}</p><span class="pill">${esc(m.who)} 추천</span></div><div class="actions">${controls(m)}<button class="secondary" data-share>상세 링크 복사</button></div></div></section>${sourcePanels(m)}<section class="section"><div class="section-head"><h2>추천된 방송</h2><small>작품 하나 · 방송 이력 각각</small></div><ul class="history">${history.map(r=>`<li><span>${esc(r.date)}</span><strong>${esc(r.who)} 추천</strong></li>`).join('')}</ul></section><p class="fine">이 시안은 OTT 시청 가능 여부를 확정하지 않습니다.</p><label class="fine">상세 주소 · 로컬 파일일 경우 HTML 파일도 함께 전달해 주세요<input class="share" readonly value="${esc(location.href)}"></label>`;}
function explore(){return `<section class="explore-gateway"><span class="eyebrow">EXPLORE</span><h1>탐색은 익숙한 그대로.</h1><p>기존 전체 영화 목록과 추천자·연도·장르·플랫폼·기타 필터를 그대로 이용합니다.</p><a class="primary" href="https://mbshow.kr/" target="_blank" rel="noopener">기존 탐색 화면 열기 ↗</a><p class="fine">이 검토용 HTML에서는 운영 탐색을 복제하지 않습니다. 위 버튼은 실제 기존 서비스의 새 탭을 엽니다. 계정·책갈피·제외 설정도 기존 서비스에서 그대로 유지됩니다.</p></section>`;}
function shelf(set,watchedShelf){const list=current().filter(m=>set.has(workId(m)));return list.length?`<div class="shelf-grid">${list.map(m=>`<article class="shelf-card"><img src="${pic(m)}" alt="${esc(m.title)} 포스터"><div><h3><a href="${detailHref(m)}">${esc(m.title)}</a></h3><small class="muted">${esc(m.year)}</small><br><button ${watchedShelf?'data-wanted':'data-watched'}="${key(m)}">${watchedShelf?'보고 싶은 것으로 이동':'본 것으로 이동'}</button><button data-remove="${key(m)}">기록 삭제</button></div></article>`).join('')}</div>`:'<p class="empty muted">아직 담은 작품이 없습니다. <a class="bottom-link" href="#home">추천작 보기</a></p>';}
function my(){return `<section class="section"><h1>마이 시네마</h1><p class="fine">시안 전용 기록입니다. 계정과 연결되지 않으며 새로고침하면 초기화됩니다.</p><section class="section"><h2>본 것 <small class="muted">${watched.size}</small></h2>${shelf(watched,true)}</section><section class="section"><h2>보고 싶은 것 <small class="muted">${wanted.size}</small></h2>${shelf(wanted,false)}</section><a class="fine bottom-link" href="https://mbshow.kr/" target="_blank" rel="noopener">기존 내 책갈피 열기 ↗</a></section>`;}
function setCollection(id,type){if(type==='remove'){wanted.delete(id);watched.delete(id);return;}const target=type==='watched'?watched:wanted,other=type==='watched'?wanted:watched;if(target.has(id))target.delete(id);else{target.add(id);other.delete(id);}}
function render(){const hash=location.hash.slice(1)||'home';document.getElementById('view').innerHTML=hash.startsWith('work=')?detail(decodeURIComponent(hash.slice(5))):hash==='explore'?explore():hash==='my'?my():home();document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===hash?'page':'false'));}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;for(const type of ['wanted','watched','remove'])if(b.hasAttribute('data-'+type)){setCollection(decodeURIComponent(b.dataset[type]),type);render();return;}if(b.hasAttribute('data-share')){try{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent='주소를 복사했습니다. 로컬 파일일 경우 HTML 파일도 함께 전달해 주세요.';}catch{document.getElementById('status').textContent='아래 주소 칸에서 직접 복사해 주세요.';}}});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></html>
