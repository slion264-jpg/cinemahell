name: 시네마지옥 주간 업데이트

on:
  schedule:
    - cron: '0 11 * * 5'   # 매주 금요일 20:00 KST (UTC 11:00)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install youtubei.js node-fetch

      - name: 시네마지옥 추천작 확인 및 반영
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node weekly-update.js

      - name: 변경사항 커밋 및 푸시
        id: commit
        run: |
          git config user.name "cinemahell-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "변경사항 없음 - 커밋 생략"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git add public/index.html public/sitemap.xml
            git commit -m "feat: 시네마지옥 주간 추천작 자동 업데이트"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN으로 푸시한 커밋은 다른 워크플로우의 on:push 트리거를 깨우지 않으므로
      # Firebase Deploy 워크플로우를 명시적으로 실행해준다.
      - name: Firebase Deploy 트리거
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run firebase-deploy.yml --repo ${{ github.repository }} --ref main
