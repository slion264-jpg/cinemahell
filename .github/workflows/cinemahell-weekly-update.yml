name: 시네마지옥 주간 업데이트

on:
  schedule:
    - cron: '0 13 * * 5'    # 금요일 22:00 KST
    - cron: '30 13 * * 5'   # 금요일 22:30 KST
    - cron: '0 14 * * 5'    # 금요일 23:00 KST
    - cron: '30 14 * * 5'   # 금요일 23:30 KST
    - cron: '0 15 * * 5'    # 토요일 00:00 KST (UTC는 금요일)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install youtubei.js node-fetch

      - name: 시네마지옥 추천작 확인 및 반영
        id: weekly-update
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          FINAL_ATTEMPT: ${{ github.event_name == 'schedule' && github.event.schedule == '0 15 * * 5' }}
        run: node weekly-update.js

      - name: 변경사항 커밋 및 푸시
        id: commit
        run: |
          git config user.name "cinemahell-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "변경사항 없음 - 커밋 생략"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git add public/index.html public/sitemap.xml
            git commit -m "feat: 시네마지옥 주간 추천작 자동 업데이트"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN으로 푸시한 커밋은 다른 워크플로우의 on:push 트리거를 깨우지 않으므로
      # Firebase Deploy 워크플로우를 명시적으로 실행해준다.
      - name: Firebase Deploy 트리거
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run firebase-deploy.yml --repo ${{ github.repository }} --ref main
